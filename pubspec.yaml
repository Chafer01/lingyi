name: lingyi
description: 灵译 — 查词、翻译、同传一体的个人翻译工具（Windows / Android）
publish_to: 'none'
version: 0.5.2+10

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  sqlite3: ^3.7.1
  http: ^1.4.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  flutter_tts: ^4.2.3
  ffi: ^2.1.3
  # 桌面专用（安卓上不会被调用）。锁定 0.5.x 稳定 API。
  window_manager: ^0.5.0
  tray_manager: ^0.5.0
  hotkey_manager: ^0.2.3
  # 选择图片 / PDF / 输出文件夹（Flutter 官方插件）。
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/dict/
    - assets/icons/
