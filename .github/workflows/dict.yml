name: 生成标准词库

# 手动运行一次即可：下载 ECDICT，生成 standard.db.gz，发布到 dict-v1 这个 Release。
# App 设置里的“标准词库下载地址”填：
#   https://github.com/<你的用户名>/<仓库名>/releases/download/dict-v1/standard.db.gz
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载 ECDICT
        run: |
          curl -sSL -o ecdict.zip https://github.com/skywind3000/ECDICT/releases/download/1.0.28/ecdict-sqlite-28.zip
          unzip -o -q ecdict.zip
      - name: 生成词库
        run: |
          python3 tools/build_dict.py stardict.db out
          gzip -9 -k out/standard.db
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dict-v1
          name: 标准词库（ECDICT 1.0.28）
          body: 约 135 万单词的英汉词库（不含词组），供灵译“下载标准词库”使用。数据来自 ECDICT（MIT 许可）。
          files: out/standard.db.gz
