name: 编译

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # 平台工程由 flutter create 生成；仓库里只保存需要定制的文件（清单、MainActivity、图标），
  # 已存在的文件不会被覆盖。
  CREATE_ARGS: --org com.chafer --project-name lingyi

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: 静态分析
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          # 把问题写进注解，便于通过 API 查看
          msg=$(grep -E '^ *(info|warning|error) ' analyze.txt | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ -n "$msg" ]; then echo "::warning title=flutter analyze::$msg"; fi
          exit $code
      - name: 单元测试
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -60 test.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter test::$msg"
          fi
          exit $code

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android $CREATE_ARGS .
      - run: flutter pub get
      - name: 编译 APK
        run: |
          set +e
          flutter build apk --release > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -iE 'error|exception|failed|what went wrong' -A3 build.txt | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter build apk::$msg"
          fi
          exit $code
      - run: cp build/app/outputs/flutter-apk/app-release.apk lingyi-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lingyi-android
          path: lingyi-android.apk

  windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows ${{ env.CREATE_ARGS }} .
      - run: flutter pub get
      - name: 编译 Windows
        shell: bash
        run: |
          set +e
          flutter build windows --release > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -iE 'error|exception|failed' -A2 build.txt | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter build windows::$msg"
          fi
          exit $code
      # ---- 本地后端（截图 OCR / 公式识别 / PDF 翻译）----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 编译后端
        shell: bash
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set +e
          # 每一步失败时把输出末尾写进注解，便于通过 API 查看
          step() {
            name="$1"; shift
            "$@" > step.txt 2>&1
            code=$?
            cat step.txt
            if [ $code -ne 0 ]; then
              msg=$(tail -40 step.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=后端：$name::$msg"
              exit $code
            fi
          }
          step "安装依赖" pip install -r requirements.txt pyinstaller pytest httpx
          # 预先下载公式识别模型，打进安装包，用户首次使用无需联网
          step "下载公式模型" python -c "from rapid_latex_ocr import LatexOCR; LatexOCR()"
          step "单元测试" python -m pytest tests -q
          step "PyInstaller 打包" pyinstaller lingyi_backend.spec --noconfirm --log-level WARN
          step "冒烟测试" python tools/smoke_test.py dist/lingyi_backend/lingyi_backend.exe
      - name: PDF 端到端测试（假 AI 接口）
        shell: bash
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set +e
          python tools/pdf_e2e.py dist/lingyi_backend/lingyi_backend.exe > e2e.txt 2>&1
          code=$?
          cat e2e.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -30 e2e.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::warning title=PDF 端到端测试未通过::$msg"
          fi
          exit 0
      - name: 放入安装目录
        shell: pwsh
        run: Copy-Item -Recurse backend\dist\lingyi_backend build\windows\x64\runner\Release\backend
      - name: 打包
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath lingyi-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lingyi-windows
          path: lingyi-windows.zip

  release:
    # main 分支编译成功后，按 pubspec.yaml 的版本号发布（同版本重复发布会更新安装包）
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读取版本号
        id: ver
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+]+).*/\1/')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 灵译 ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          body: |
            - **Windows**：下载 `lingyi-windows.zip`，解压后运行 `lingyi.exe`（内含截图识别 / PDF 翻译后端，解压后约 700 MB）
            - **安卓**：下载 `lingyi-android.apk` 安装（需允许安装未知来源应用）
          files: |
            lingyi-android.apk
            lingyi-windows.zip
