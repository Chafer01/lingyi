name: 编译

on:
  push:
    branches: [main]
    tags: ['v*']
    # 只改了评测/词库脚本时不重新编译
    paths-ignore:
      - 'tools/api_eval.py'
      - 'tools/build_dict.py'
      - '.github/workflows/api-eval.yml'
      - '.github/workflows/dict.yml'
      - 'tools/ocr_eval/**'
      - '.github/workflows/ocr-eval.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  # 平台工程由 flutter create 生成；仓库里只保存需要定制的文件（清单、MainActivity、图标），
  # 已存在的文件不会被覆盖。
  CREATE_ARGS: --org com.chafer --project-name lingyi

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: 静态分析
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          # 把问题写进注解，便于通过 API 查看
          msg=$(grep -E '^ *(info|warning|error) ' analyze.txt | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ -n "$msg" ]; then echo "::warning title=flutter analyze::$msg"; fi
          exit $code
      - name: 单元测试
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -60 test.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter test::$msg"
          fi
          exit $code

  android:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android $CREATE_ARGS .
      - run: flutter pub get
      - name: 编译 APK
        run: |
          set +e
          flutter build apk --release > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -iE 'error|exception|failed|what went wrong' -A3 build.txt | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter build apk::$msg"
          fi
          exit $code
      - run: cp build/app/outputs/flutter-apk/app-release.apk lingyi-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: lingyi-android
          path: lingyi-android.apk

  windows:
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows ${{ env.CREATE_ARGS }} .
      - run: flutter pub get
      - name: 编译 Windows
        shell: bash
        run: |
          set +e
          flutter build windows --release > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            msg=$(grep -iE 'error|exception|failed' -A2 build.txt | tail -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=flutter build windows::$msg"
          fi
          exit $code
      - name: Windows 实机测试（剪贴板备份恢复、自动更新脚本）
        shell: bash
        run: |
          set +e
          flutter test test/win > wintest.txt 2>&1
          code=$?
          cat wintest.txt
          msg=$(tail -40 wintest.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ $code -ne 0 ]; then echo "::error title=Windows 实机测试::$msg"; else echo "::notice title=Windows 实机测试通过::$msg"; fi
          exit $code
      # ---- 本地后端（截图 OCR / 公式识别 / PDF 翻译）----
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-nodeps.txt
      - name: 编译后端
        shell: bash
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          set +e
          # 每一步失败时把输出末尾写进注解，便于通过 API 查看
          step() {
            name="$1"; shift
            "$@" > step.txt 2>&1
            code=$?
            cat step.txt
            if [ $code -ne 0 ]; then
              msg=$(tail -80 step.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=后端：$name::$msg"
              exit $code
            fi
          }
          step "安装依赖" pip install -r requirements.txt pyinstaller pytest httpx
          step "安装依赖（不带依赖）" pip install --no-deps -r requirements-nodeps.txt
          # 预先下载公式识别模型，打进安装包，用户首次使用无需联网
          step "下载公式模型" python -c "from lingyi_backend import ocr; ocr._formula()"
          # PDF 翻译的版面模型、字体、字符映射表、tiktoken 词表打进安装包，用户无需联网下载
          step "收集 PDF 离线资源" python -m lingyi_backend.pdf_assets collect babeldoc_assets
          step "单元测试" python -m pytest tests -q
          step "PyInstaller 打包" pyinstaller lingyi_backend.spec --noconfirm --log-level WARN
          step "冒烟测试" python tools/smoke_test.py dist/lingyi_backend/lingyi_backend.exe
      - name: PDF 端到端测试（断网，只用内置离线资源）
        shell: bash
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
          # 代理指向不存在的地址：BabelDOC 若还想下载模型/字体/词表就会失败；本机的假 AI 接口不受影响
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: |
          set +e
          # 清空收集资源时留下的缓存，确保用的是安装包里的离线资源
          rm -rf "$USERPROFILE/.cache/babeldoc"
          python tools/pdf_e2e.py dist/lingyi_backend/lingyi_backend.exe > e2e.txt 2>&1
          code=$?
          cat e2e.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -40 e2e.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=PDF 离线端到端测试未通过::$msg"
          else
            msg=$(tail -8 e2e.txt | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=PDF 离线端到端测试通过::$msg"
          fi
          exit $code
      - name: 放入安装目录
        shell: pwsh
        run: Copy-Item -Recurse backend\dist\lingyi_backend build\windows\x64\runner\Release\backend
      - name: 后端构建编号（源码不变则编号不变，自动更新时就不必重新下载后端）
        shell: bash
        run: bash tools/backend_id.sh > build/windows/x64/runner/Release/backend/BUILD_ID
      - name: 打包
        shell: pwsh
        run: |
          $rel = 'build\windows\x64\runner\Release'
          # 完整安装包（首次安装）
          Compress-Archive -Path "$rel\*" -DestinationPath lingyi-windows.zip
          # 自动更新用：程序本体（不含后端）与后端分开
          Compress-Archive -Path (Get-ChildItem $rel -Exclude backend).FullName -DestinationPath lingyi-windows-app.zip
          Compress-Archive -Path "$rel\backend\*" -DestinationPath lingyi-windows-backend.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lingyi-windows
          path: lingyi-windows.zip

  release:
    # main 分支编译成功后，按 pubspec.yaml 的版本号发布（同版本重复发布会更新安装包）
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 读取版本号
        id: ver
        run: |
          v=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*([^+]+).*/\1/')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: 生成 update.json（灵译检查更新时读取）
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          v="${TAG#v}"
          base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          asset() { jq -n --arg url "$base/$1" --argjson size "$(stat -c %s "$1")" --arg sha "$(sha256sum "$1" | cut -d' ' -f1)" '{url:$url,size:$size,sha256:$sha}'; }
          # 更新说明取自这次提交的说明（去掉署名行）
          notes=$(git log -1 --format=%B | grep -vE '^(Co-Authored-By|Claude-Session):' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          jq -n --arg version "$v" --arg notes "$notes" --arg page "https://github.com/${{ github.repository }}/releases/tag/$TAG" \
            --arg backend_id "$(bash tools/backend_id.sh)" \
            --argjson windows_app "$(asset lingyi-windows-app.zip)" \
            --argjson windows_backend "$(asset lingyi-windows-backend.zip)" \
            --argjson windows_full "$(asset lingyi-windows.zip)" \
            --argjson android "$(asset lingyi-android.apk)" \
            '{version:$version,notes:$notes,page:$page,backend_id:$backend_id,windows_app:$windows_app,windows_backend:$windows_backend,windows_full:$windows_full,android:$android}' > update.json
          cat update.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 灵译 ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          body: |
            - **Windows**：首次安装下载 `lingyi-windows.zip`，解压后运行 `lingyi.exe`（内含截图识别 / PDF 翻译后端，解压后约 700 MB）。
              已安装 0.5.3 及以上版本的，在 设置 → 关于与更新 里一键更新即可（`-app` / `-backend` 两个包和 `update.json` 供自动更新使用）
            - **安卓**：下载 `lingyi-android.apk` 安装（需允许安装未知来源应用）
          files: |
            lingyi-android.apk
            lingyi-windows.zip
            lingyi-windows-app.zip
            lingyi-windows-backend.zip
            update.json
