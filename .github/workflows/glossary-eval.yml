name: 术语表实测

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 实测
        env:
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          python3 tools/glossary_eval/run.py | tee out.txt
          msg=$(sed 's/%/%25/g' out.txt | awk '{printf "%s%%0A", $0}')
          echo "::notice title=术语表实测::$msg"
