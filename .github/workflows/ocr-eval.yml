name: 截图识别实测

# 手动运行：用 tools/ocr_eval/fixtures 下的测试图（论文排版的文字 + 公式），
# 对比各视觉大模型的识别准确度。结果提交到 eval-results 分支的 eval/ocr/results.md。
on:
  workflow_dispatch:
    inputs:
      only:
        description: '只测名称包含这些关键字的模型（逗号分隔，如 GLM-4.6V,Qwen3.5-397B）；留空测全部'
        required: false
        default: ''
      diag:
        description: '只运行智谱视觉模型诊断（true/false）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 智谱诊断
        if: inputs.diag == 'true'
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: |
          python3 tools/ocr_eval/diag_zhipu.py > diag.txt 2>&1
          cat diag.txt
          msg=$(sed 's/%/%25/g' diag.txt | awk '{printf "%s%%0A", $0}')
          echo "::notice title=智谱诊断::$msg"
      - name: 实测
        if: inputs.diag != 'true'
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
        run: python3 tools/ocr_eval/run_eval.py --only "${{ inputs.only }}" --out /tmp/ocr
      - name: 提交结果
        if: inputs.diag != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin eval-results && git checkout -B eval-results origin/eval-results || git checkout --orphan eval-results
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name eval -exec rm -rf {} +
          mkdir -p eval && rm -rf eval/ocr && cp -r /tmp/ocr eval/ocr
          git add eval
          git commit -m "截图识别实测 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin eval-results
