name: 翻译接口实测

# 手动运行。密钥放在仓库 Settings → Secrets and variables → Actions 里，没配的接口只做无密钥探测。
# 结果提交到 eval-results 分支的 eval/results.md。
on:
  workflow_dispatch:
    inputs:
      only:
        description: '只测这些接口（逗号分隔，如 魔搭,智谱）；留空测全部'
        required: false
        default: ''
      maxtests:
        description: '每个接口最多测几句（0 = 全部）'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 实测
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QIANFAN_API_KEY: ${{ secrets.QIANFAN_API_KEY }}
          SPARK_API_PASSWORD: ${{ secrets.SPARK_API_PASSWORD }}
          VOLC_AK: ${{ secrets.VOLC_AK }}
          VOLC_SK: ${{ secrets.VOLC_SK }}
          BAIDU_APPID: ${{ secrets.BAIDU_APPID }}
          BAIDU_KEY: ${{ secrets.BAIDU_KEY }}
          AMD_API_KEY: ${{ secrets.AMD_API_KEY }}
          ONLY: ${{ inputs.only }}
          MAXTESTS: ${{ inputs.maxtests }}
        run: python3 tools/api_eval.py
      - name: 提交结果
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp -r eval /tmp/eval
          git fetch origin eval-results || true
          git checkout -B eval-results
          git rm -rq --cached . >/dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/eval eval
          git add eval
          git commit -m "实测结果 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin eval-results
